<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Should I Buy · Settings</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1a202c; }
    h1 { margin-bottom: 4px; }
    .sub { color: #4a5568; margin-top: 0; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    small { display: block; font-weight: 400; color: #718096; }
    input, select { width: 100%; padding: 8px; font: inherit; border: 1px solid #cbd5e0; border-radius: 8px; box-sizing: border-box; margin-top: 4px; }
    .free { margin-top: 18px; padding: 12px; border-radius: 10px; background: #f0fff4; }
    button { margin-top: 18px; padding: 10px 18px; font: inherit; border: 0; border-radius: 8px; background: #2b6cb0; color: #fff; cursor: pointer; }
    button.secondary { background: #e2e8f0; color: #1a202c; }
    #status, #ollama { margin-left: 10px; }
    details { margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Should I Buy 💸</h1>
  <p class="sub">Your numbers stay on this computer. Nothing is sent to any server.</p>

  <label>What's your name? <small>Optional, so the tips talk to you.</small>
    <input id="name" type="text"></label>
  <label>Monthly net income
    <input id="income" type="number" min="0" step="0.01"></label>
  <label>Monthly fixed expenses <small>Rent, bills, transport, subscriptions…</small>
    <input id="fixed" type="number" min="0" step="0.01"></label>
  <label>Monthly savings <small>What you want to put aside no matter what. Enter 0 if you don't save.</small>
    <input id="savings" type="number" min="0" step="0.01"></label>
  <label>Payday (day of the month)
    <input id="payday" type="number" min="1" max="28"></label>
  <label>Currency
    <select id="currency"><option>EUR</option><option>USD</option><option>GBP</option><option>MXN</option><option>ARS</option><option>COP</option><option>CLP</option></select></label>

  <div class="free" id="free"></div>

  <details>
    <summary>Local AI (Ollama)</summary>
    <label>Model <input id="model" type="text"></label>
    <label>Ollama address <input id="ollamaUrl" type="text"></label>
    <button class="secondary" id="test">Test connection</button><span id="ollama"></span>
  </details>

  <button id="save">Save</button><span id="status"></span>

  <script type="module" src="options.js"></script>
</body>
</html>
